<svg xmlns="http://www.w3.org/2000/svg" width="680" height="556" viewBox="0 0 680 556" role="img">
<style>
  :root{
    --s1:#ffffff; --b:#d3d0cb; --tp:#1a1815; --tsec:#5c5852;
    --text-danger:#b91c1c; --text-accent:#b45309; --text-success:#15803d;
    --blue-f:#e6f1fb; --blue-s:#a9cbec; --blue-t:#0c447c;
    --teal-f:#e1f2f1; --teal-s:#9dcfcb; --teal-t:#0b4f4a;
    --amber-f:#fdf0dc; --amber-s:#efcb94; --amber-t:#7a4b06;
    --green-f:#e4f2e4; --green-s:#a6d0a6; --green-t:#14532d;
    --red-f:#fbe9e9;  --red-s:#ebb3b3;  --red-t:#7f1d1d;
    --gray-f:#f0efed; --gray-s:#d3d0cb; --gray-t:#3a3733;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --s1:#1c1a18; --b:#3e3a35; --tp:#edeae5; --tsec:#a8a39c;
      --text-danger:#f87171; --text-accent:#fbbf24; --text-success:#4ade80;
      --blue-f:#0f2a44; --blue-s:#2e5b87; --blue-t:#cfe4f7;
      --teal-f:#0d2e2c; --teal-s:#2c625d; --teal-t:#cbe9e6;
      --amber-f:#3a2a0e; --amber-s:#7a5a24; --amber-t:#f6dfb4;
      --green-f:#12301c; --green-s:#2f6338; --green-t:#cde8d3;
      --red-f:#3a1616;  --red-s:#7a3030;  --red-t:#f3cfcf;
      --gray-f:#24221f; --gray-s:#4a4641; --gray-t:#e3e0db;
    }
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:14px;font-weight:400;fill:var(--tp)}
  .ts{font-size:12px;font-weight:400;fill:var(--tsec)}
  .th{font-size:14px;font-weight:500;fill:var(--tp)}
  .arr{stroke:var(--tsec);stroke-width:1.5;fill:none}
  .leader{stroke:var(--b);stroke-width:.5;stroke-dasharray:3 3;fill:none}
  .c-blue>rect,.c-blue>circle{fill:var(--blue-f);stroke:var(--blue-s);stroke-width:.5}
  .c-blue>text{fill:var(--blue-t)}
  .c-teal>rect,.c-teal>circle{fill:var(--teal-f);stroke:var(--teal-s);stroke-width:.5}
  .c-teal>text{fill:var(--teal-t)}
  .c-amber>rect,.c-amber>circle{fill:var(--amber-f);stroke:var(--amber-s);stroke-width:.5}
  .c-amber>text{fill:var(--amber-t)}
  .c-green>rect,.c-green>circle{fill:var(--green-f);stroke:var(--green-s);stroke-width:.5}
  .c-green>text{fill:var(--green-t)}
  .c-red>rect,.c-red>circle{fill:var(--red-f);stroke:var(--red-s);stroke-width:.5}
  .c-red>text{fill:var(--red-t)}
  .c-gray>rect,.c-gray>circle{fill:var(--gray-f);stroke:var(--gray-s);stroke-width:.5}
  .c-gray>text{fill:var(--gray-t)}
</style>
  <title>How YuNet and SFace divide the work</title>
  <desc>A camera frame goes to YuNet, which finds every face and returns a box, five landmarks and a confidence score for each. Those landmarks are then used to straighten and crop the face before SFace turns it into a fingerprint of 128 numbers, which is compared against stored fingerprints. YuNet runs every frame; the SFace half runs only in Smart mode, every fifth frame.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="120" y="44" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="66">Camera frame</text>
    <text class="ts" x="136" y="84">480 × 360, one per loop</text>
  </g>
  <line class="arr" x1="300" y1="96" x2="300" y2="114" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="120" y="114" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="136">YuNet · detection</text>
    <text class="ts" x="136" y="154">232 KB · about 42 ms on the Pi</text>
  </g>
  <line class="arr" x1="300" y1="166" x2="300" y2="184" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="120" y="184" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="206">Where every face is</text>
    <text class="ts" x="136" y="224">box, 5 landmarks, score — 15 numbers each</text>
  </g>
  <line class="arr" x1="300" y1="236" x2="300" y2="254" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="120" y="254" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="276">alignCrop</text>
    <text class="ts" x="136" y="294">the landmarks straighten the face first</text>
  </g>
  <line class="arr" x1="300" y1="306" x2="300" y2="324" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="120" y="324" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="346">SFace · recognition</text>
    <text class="ts" x="136" y="364">38.7 MB · about 65 ms on the Pi</text>
  </g>
  <line class="arr" x1="300" y1="376" x2="300" y2="394" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="120" y="394" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="416">Who that face is</text>
    <text class="ts" x="136" y="434">a fingerprint of 128 numbers</text>
  </g>
  <line class="arr" x1="300" y1="446" x2="300" y2="464" marker-end="url(#arrow)"/>

  <g class="c-green">
    <rect x="120" y="464" width="360" height="52" rx="4"/>
    <text class="th" x="136" y="486">Compare with the stored ones</text>
    <text class="ts" x="136" y="504">same person scores 0.88–0.96, others 0.20</text>
  </g>

  <line class="leader" x1="490" y1="114" x2="490" y2="236"/>
  <line class="leader" x1="490" y1="175" x2="500" y2="175"/>
  <g class="c-gray">
    <rect x="502" y="155" width="138" height="40" rx="4"/>
    <text class="ts" x="516" y="180">Every frame</text>
  </g>

  <line class="leader" x1="490" y1="254" x2="490" y2="516"/>
  <line class="leader" x1="490" y1="394" x2="500" y2="394"/>
  <g class="c-gray">
    <rect x="502" y="365" width="138" height="58" rx="4"/>
    <text class="ts" x="516" y="390">Smart mode only,</text>
    <text class="ts" x="516" y="408">every 5th frame</text>
  </g>
</svg>
