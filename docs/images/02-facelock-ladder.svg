<svg xmlns="http://www.w3.org/2000/svg" width="680" height="508" viewBox="0 0 680 508" role="img">
<style>
  :root{
    --s1:#ffffff; --b:#d3d0cb; --tp:#1a1815; --tsec:#5c5852;
    --text-danger:#b91c1c; --text-accent:#b45309; --text-success:#15803d;
    --blue-f:#e6f1fb; --blue-s:#a9cbec; --blue-t:#0c447c;
    --teal-f:#e1f2f1; --teal-s:#9dcfcb; --teal-t:#0b4f4a;
    --amber-f:#fdf0dc; --amber-s:#efcb94; --amber-t:#7a4b06;
    --green-f:#e4f2e4; --green-s:#a6d0a6; --green-t:#14532d;
    --red-f:#fbe9e9;  --red-s:#ebb3b3;  --red-t:#7f1d1d;
    --gray-f:#f0efed; --gray-s:#d3d0cb; --gray-t:#3a3733;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --s1:#1c1a18; --b:#3e3a35; --tp:#edeae5; --tsec:#a8a39c;
      --text-danger:#f87171; --text-accent:#fbbf24; --text-success:#4ade80;
      --blue-f:#0f2a44; --blue-s:#2e5b87; --blue-t:#cfe4f7;
      --teal-f:#0d2e2c; --teal-s:#2c625d; --teal-t:#cbe9e6;
      --amber-f:#3a2a0e; --amber-s:#7a5a24; --amber-t:#f6dfb4;
      --green-f:#12301c; --green-s:#2f6338; --green-t:#cde8d3;
      --red-f:#3a1616;  --red-s:#7a3030;  --red-t:#f3cfcf;
      --gray-f:#24221f; --gray-s:#4a4641; --gray-t:#e3e0db;
    }
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:14px;font-weight:400;fill:var(--tp)}
  .ts{font-size:12px;font-weight:400;fill:var(--tsec)}
  .th{font-size:14px;font-weight:500;fill:var(--tp)}
  .arr{stroke:var(--tsec);stroke-width:1.5;fill:none}
  .leader{stroke:var(--b);stroke-width:.5;stroke-dasharray:3 3;fill:none}
  .c-blue>rect,.c-blue>circle{fill:var(--blue-f);stroke:var(--blue-s);stroke-width:.5}
  .c-blue>text{fill:var(--blue-t)}
  .c-teal>rect,.c-teal>circle{fill:var(--teal-f);stroke:var(--teal-s);stroke-width:.5}
  .c-teal>text{fill:var(--teal-t)}
  .c-amber>rect,.c-amber>circle{fill:var(--amber-f);stroke:var(--amber-s);stroke-width:.5}
  .c-amber>text{fill:var(--amber-t)}
  .c-green>rect,.c-green>circle{fill:var(--green-f);stroke:var(--green-s);stroke-width:.5}
  .c-green>text{fill:var(--green-t)}
  .c-red>rect,.c-red>circle{fill:var(--red-f);stroke:var(--red-s);stroke-width:.5}
  .c-red>text{fill:var(--red-t)}
  .c-gray>rect,.c-gray>circle{fill:var(--gray-f);stroke:var(--gray-s);stroke-width:.5}
  .c-gray>text{fill:var(--gray-t)}
</style>
  <title>How FaceLock decides which face is you</title>
  <desc>Each frame, FaceLock tries three tests in order of cost: first whether a face sits near where yours just was, then an expensive fingerprint comparison, then falling back to the widest face if nobody is locked on yet. It then re-checks the fingerprint every fifth frame and smooths the result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="60" y="44" width="360" height="54" rx="4"/>
    <text class="th" x="76" y="68">Faces this frame</text>
    <text class="ts" x="76" y="86">YuNet, widest first</text>
  </g>
  <line class="arr" x1="240" y1="98" x2="240" y2="118" marker-end="url(#arrow)"/>

  <g class="c-green">
    <rect x="60" y="118" width="360" height="58" rx="4"/>
    <text class="th" x="76" y="142">1 · Near where it just was</text>
    <text class="ts" x="76" y="160">position and size — nearly free</text>
  </g>
  <line class="arr" x1="240" y1="176" x2="240" y2="196" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="60" y="196" width="360" height="58" rx="4"/>
    <text class="th" x="76" y="220">2 · Fingerprint, anywhere</text>
    <text class="ts" x="76" y="238">SFace ≈65 ms — only if 1 failed</text>
  </g>
  <line class="arr" x1="240" y1="254" x2="240" y2="274" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="60" y="274" width="360" height="58" rx="4"/>
    <text class="th" x="76" y="298">3 · Nobody locked on yet</text>
    <text class="ts" x="76" y="316">the widest face becomes you</text>
  </g>
  <line class="arr" x1="240" y1="332" x2="240" y2="352" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="60" y="352" width="360" height="58" rx="4"/>
    <text class="th" x="76" y="376">Still you?</text>
    <text class="ts" x="76" y="394">re-checked every 5th frame</text>
  </g>
  <line class="arr" x1="240" y1="410" x2="240" y2="430" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="60" y="430" width="360" height="58" rx="4"/>
    <text class="th" x="76" y="454">Smooth, then hand over (x, w)</text>
    <text class="ts" x="76" y="472">40% of the way to the new reading</text>
  </g>

  <line class="arr" x1="422" y1="303" x2="443" y2="303" marker-end="url(#arrow)"/>
  <g class="c-gray">
    <rect x="445" y="268" width="195" height="80" rx="4"/>
    <text class="th" x="461" y="292">If all three fail</text>
    <text class="ts" x="461" y="312">forget where you were,</text>
    <text class="ts" x="461" y="330">never your fingerprints</text>
  </g>
</svg>
