<svg xmlns="http://www.w3.org/2000/svg" width="680" height="612" viewBox="0 0 680 612" role="img">
<style>
  :root{
    --s1:#ffffff; --b:#d3d0cb; --tp:#1a1815; --tsec:#5c5852;
    --text-danger:#b91c1c; --text-accent:#b45309; --text-success:#15803d;
    --blue-f:#e6f1fb; --blue-s:#a9cbec; --blue-t:#0c447c;
    --teal-f:#e1f2f1; --teal-s:#9dcfcb; --teal-t:#0b4f4a;
    --amber-f:#fdf0dc; --amber-s:#efcb94; --amber-t:#7a4b06;
    --green-f:#e4f2e4; --green-s:#a6d0a6; --green-t:#14532d;
    --red-f:#fbe9e9;  --red-s:#ebb3b3;  --red-t:#7f1d1d;
    --gray-f:#f0efed; --gray-s:#d3d0cb; --gray-t:#3a3733;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --s1:#1c1a18; --b:#3e3a35; --tp:#edeae5; --tsec:#a8a39c;
      --text-danger:#f87171; --text-accent:#fbbf24; --text-success:#4ade80;
      --blue-f:#0f2a44; --blue-s:#2e5b87; --blue-t:#cfe4f7;
      --teal-f:#0d2e2c; --teal-s:#2c625d; --teal-t:#cbe9e6;
      --amber-f:#3a2a0e; --amber-s:#7a5a24; --amber-t:#f6dfb4;
      --green-f:#12301c; --green-s:#2f6338; --green-t:#cde8d3;
      --red-f:#3a1616;  --red-s:#7a3030;  --red-t:#f3cfcf;
      --gray-f:#24221f; --gray-s:#4a4641; --gray-t:#e3e0db;
    }
  }
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:14px;font-weight:400;fill:var(--tp)}
  .ts{font-size:12px;font-weight:400;fill:var(--tsec)}
  .th{font-size:14px;font-weight:500;fill:var(--tp)}
  .arr{stroke:var(--tsec);stroke-width:1.5;fill:none}
  .leader{stroke:var(--b);stroke-width:.5;stroke-dasharray:3 3;fill:none}
  .c-blue>rect,.c-blue>circle{fill:var(--blue-f);stroke:var(--blue-s);stroke-width:.5}
  .c-blue>text{fill:var(--blue-t)}
  .c-teal>rect,.c-teal>circle{fill:var(--teal-f);stroke:var(--teal-s);stroke-width:.5}
  .c-teal>text{fill:var(--teal-t)}
  .c-amber>rect,.c-amber>circle{fill:var(--amber-f);stroke:var(--amber-s);stroke-width:.5}
  .c-amber>text{fill:var(--amber-t)}
  .c-green>rect,.c-green>circle{fill:var(--green-f);stroke:var(--green-s);stroke-width:.5}
  .c-green>text{fill:var(--green-t)}
  .c-red>rect,.c-red>circle{fill:var(--red-f);stroke:var(--red-s);stroke-width:.5}
  .c-red>text{fill:var(--red-t)}
  .c-gray>rect,.c-gray>circle{fill:var(--gray-f);stroke:var(--gray-s);stroke-width:.5}
  .c-gray>text{fill:var(--gray-t)}
</style>
  <title>FollowBot system architecture</title>
  <desc>One camera frame travels through four steps on the Raspberry Pi, then crosses a USB serial link to the Arduino Uno, which mixes the command into two wheel speeds and drives the motors. A phone or laptop talks to the Pi separately over WiFi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="50" y="56" width="340" height="314" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="th" x="66" y="80">Raspberry Pi 4 — follow.py</text>

  <g class="c-blue">
    <rect x="70" y="92" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="114">1 · See</text>
    <text class="ts" x="86" y="132">one frame from the camera</text>
  </g>
  <line class="arr" x1="220" y1="142" x2="220" y2="158" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="70" y="158" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="180">2 · Find</text>
    <text class="ts" x="86" y="198">vision.py → (x, w), or nothing</text>
  </g>
  <line class="arr" x1="220" y1="208" x2="220" y2="224" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="70" y="224" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="246">3 · Decide</text>
    <text class="ts" x="86" y="264">brain.py → (fwd, turn)</text>
  </g>
  <line class="arr" x1="220" y1="274" x2="220" y2="290" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="70" y="290" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="312">4 · Act</text>
    <text class="ts" x="86" y="330">one line over USB, 115200 baud</text>
  </g>

  <line class="arr" x1="220" y1="342" x2="220" y2="444" marker-end="url(#arrow)"/>

  <rect x="50" y="412" width="340" height="180" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="th" x="66" y="436">Arduino Uno + TB6612 shield</text>

  <g class="c-amber">
    <rect x="70" y="446" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="468">Mix and ramp</text>
    <text class="ts" x="86" y="486">left = fwd+turn, right = fwd−turn</text>
  </g>
  <line class="arr" x1="220" y1="496" x2="220" y2="512" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="70" y="512" width="300" height="50" rx="4"/>
    <text class="th" x="86" y="534">Two motors</text>
    <text class="ts" x="86" y="552">stop if the Pi goes quiet for 500 ms</text>
  </g>

  <rect x="420" y="150" width="220" height="180" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text class="th" x="436" y="174">Your phone or laptop</text>

  <g class="c-teal">
    <rect x="436" y="186" width="190" height="54" rx="4"/>
    <text class="th" x="450" y="208">web.py</text>
    <text class="ts" x="450" y="226">dashboard on port 8000</text>
  </g>
  <line class="arr" x1="531" y1="240" x2="531" y2="256" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="436" y="256" width="190" height="54" rx="4"/>
    <text class="th" x="450" y="278">You</text>
    <text class="ts" x="450" y="296">mode, joystick, STOP</text>
  </g>

  <line class="arr" x1="394" y1="240" x2="416" y2="240" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
